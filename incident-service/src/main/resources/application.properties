server.port=8082
spring.application.name=incident-service

# For PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/campusops_incident
spring.datasource.username=postgres
spring.datasource.password=PG18
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Resilience4j Circuit Breaker configuration
resilience4j.circuitbreaker.instances.assetService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.assetService.sliding-window-size=5
resilience4j.circuitbreaker.instances.assetService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.assetService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.assetService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.assetService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.assetService.automatic-transition-from-open-to-half-open-enabled=true

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Kafka topics
campusops.kafka.topics.incident-created=incident.created.v1
campusops.kafka.topics.incident-assigned=incident.assigned.v1