# DataSource configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/campusops_incident
spring.datasource.username=postgres
spring.datasource.password=PG18
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

# Disable Eureka in test
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Disable Kafka auto-configuration in test (mock KafkaTemplate provided by KafkaTestConfig)
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

# Kafka topics
campusops.kafka.topics.incident-created=incident.created.v1
campusops.kafka.topics.incident-assigned=incident.assigned.v1
campusops.kafka.topics.sla-breached=incident.sla-breached.v1

# SLA engine
campusops.sla.duration.low=PT48H
campusops.sla.duration.medium=PT12H
campusops.sla.duration.high=PT4H
campusops.sla.duration.critical=PT30M
campusops.sla.scan-interval=PT30S
