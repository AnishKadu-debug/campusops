server.port=8083
spring.application.name=asset-service

# MongoDB configuration
spring.mongodb.uri=mongodb://localhost:27017/campusops_asset

# Eureka Client configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Security (DEV ONLY shared HS256 secret - must match incident-service, never use in production)
campusops.security.jwt.secret=campusops-dev-jwt-secret-change-me-0123456789
