server.port=8084
spring.application.name=notification-service

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/campusops_notification
spring.datasource.username=postgres
spring.datasource.password=PG18
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.missing-topics-fatal=false

# Topics
campusops.kafka.topics.incident-created=incident.created.v1
campusops.kafka.topics.incident-assigned=incident.assigned.v1
campusops.kafka.topics.sla-breached=incident.sla-breached.v1

# Actuator
management.endpoints.web.exposure.include=health,info
