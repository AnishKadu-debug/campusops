server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Static assets cache & SPA client-side fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Incident Service reverse proxy
    location /api/v1/incidents {
        proxy_pass http://incident-service:8082/api/v1/incidents;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Asset Service reverse proxy
    location /api/v1/assets {
        proxy_pass http://asset-service:8083/api/v1/assets;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Notification Service reverse proxy
    location /api/v1/notifications {
        proxy_pass http://notification-service:8084/api/v1/notifications;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator health check proxies for observability
    location /api/actuator/incident/ {
        proxy_pass http://incident-service:8082/actuator/;
    }

    location /api/actuator/asset/ {
        proxy_pass http://asset-service:8083/actuator/;
    }

    location /api/actuator/notification/ {
        proxy_pass http://notification-service:8084/actuator/;
    }
}
